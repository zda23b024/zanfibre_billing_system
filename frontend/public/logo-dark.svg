<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Zanfibre Logo - Dark Mode</title>
  <desc id="desc">Zanfibre app icon with a fast fiber Z mark and signal lines.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="84" x2="928" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10251F"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="z" x1="255" y1="284" x2="770" y2="745" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D18B"/>
      <stop offset="0.55" stop-color="#36A9FF"/>
      <stop offset="1" stop-color="#F2C94C"/>
    </linearGradient>
    <linearGradient id="signal" x1="226" y1="182" x2="650" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D18B"/>
      <stop offset="1" stop-color="#36A9FF"/>
    </linearGradient>
    <filter id="glow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.70 0 0 0 0 1.00 0 0 0 0.34 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="76" y="76" width="872" height="872" rx="196" stroke="#244A57" stroke-width="20" opacity="0.9"/>
  <g filter="url(#glow)">
    <path d="M322 310H744L414 714H748" stroke="url(#z)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M254 378C328 286 430 238 548 238" stroke="url(#signal)" stroke-width="40" stroke-linecap="round"/>
    <path d="M304 454C360 390 438 356 528 356" stroke="url(#signal)" stroke-width="34" stroke-linecap="round" opacity="0.82"/>
    <path d="M358 530C398 492 450 472 512 472" stroke="url(#signal)" stroke-width="28" stroke-linecap="round" opacity="0.68"/>
    <circle cx="754" cy="714" r="44" fill="#F2C94C" stroke="#F7FAFC" stroke-width="22"/>
  </g>
</svg>
