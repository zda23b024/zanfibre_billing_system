services:
  - type: web
    name: zanfibre-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Dar_es_Salaam
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zanfibre-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zanfibre-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_PROVIDER
        value: manual_mixx
      - key: DEFAULT_CURRENCY
        value: TZS
      - key: CUSTOMER_PORTAL_BASE_URL
        sync: false
      - key: BACKGROUND_WORKERS_ENABLED
        value: "false"
      - key: MIXX_MERCHANT_NUMBER
        value: "18198639"
      - key: MIXX_MERCHANT_NAME
        value: IBRAHIM YAHYA ALLY
      - key: MIXX_QR_IMAGE_PATH
        value: ""
      - key: INFLUXDB_URL
        value: http://127.0.0.1:9
      - key: INFLUXDB_TOKEN
        value: ""
      - key: INFLUXDB_ORG
        value: zanfibre
      - key: INFLUXDB_BUCKET
        value: metrics

  - type: web
    name: zanfibre-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: keyvalue
    name: zanfibre-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: zanfibre-postgres
    plan: free
    databaseName: zanfibre
    user: zanfibre
